<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>酷狗音乐 · Web Player</title>
<style>
  :root{
    --kg-blue:#1ec8ff;
    --kg-blue-2:#1e8bff;
    --kg-purple:#7b5cff;
    --bg-0:#0e0f1a;
    --bg-1:#161827;
    --bg-2:#1f2236;
    --bg-3:#272b45;
    --text:#e8eaf6;
    --text-dim:#9aa0c0;
    --line:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(123,92,255,.25),transparent 60%),
               radial-gradient(900px 500px at -10% 110%,rgba(30,200,255,.18),transparent 55%),
               var(--bg-0);
    color:var(--text);
    overflow:hidden;
    user-select:none;
  }
  .app{display:flex;flex-direction:column;height:100vh}

  /* Top bar */
  .topbar{
    height:60px;display:flex;align-items:center;gap:24px;
    padding:0 22px;background:rgba(20,22,38,.7);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
  .logo .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--kg-blue),var(--kg-purple));
    display:grid;place-items:center;font-size:18px;box-shadow:0 6px 18px rgba(30,200,255,.35);
  }
  .logo b{background:linear-gradient(135deg,var(--kg-blue),var(--kg-purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .search{flex:1;max-width:520px;position:relative}
  .search input{
    width:100%;height:38px;border-radius:20px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--text);padding:0 16px 0 40px;font-size:14px;outline:none;
  }
  .search input:focus{border-color:var(--kg-blue)}
  .search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .top-actions{display:flex;align-items:center;gap:14px;color:var(--text-dim);font-size:13px}
  .top-actions .ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff8a5b,#ff5b8a);display:grid;place-items:center;font-size:14px}

  /* Layout */
  .layout{flex:1;display:flex;min-height:0}
  .sidebar{
    width:210px;background:rgba(16,18,30,.55);border-right:1px solid var(--line);
    padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  }
  .nav-group{font-size:12px;color:var(--text-dim);padding:14px 12px 6px;letter-spacing:1px}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    color:var(--text-dim);cursor:pointer;font-size:14px;transition:.15s;
  }
  .nav-item:hover{background:var(--bg-2);color:var(--text)}
  .nav-item.active{background:linear-gradient(135deg,rgba(30,200,255,.18),rgba(123,92,255,.18));color:#fff}
  .nav-item .ic{width:20px;text-align:center}

  .content{flex:1;overflow:auto;padding:22px 26px}
  .hero{
    height:190px;border-radius:18px;padding:26px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,rgba(30,139,255,.35),rgba(123,92,255,.35));
    border:1px solid var(--line);margin-bottom:24px;
  }
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%)}
  .hero h2{font-size:26px;margin-bottom:8px}
  .hero p{color:var(--text-dim);font-size:14px;max-width:60%}
  .hero .play-hero{
    margin-top:18px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:#fff;color:#111;border:none;border-radius:24px;padding:10px 22px;font-weight:700;font-size:14px;
  }
  .section-title{font-size:16px;font-weight:700;margin:6px 2px 14px;display:flex;justify-content:space-between;align-items:center}
  .section-title a{color:var(--text-dim);font-size:13px;cursor:pointer}

  .songlist{background:rgba(20,22,38,.4);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .sl-head,.sl-row{display:grid;grid-template-columns:54px 1fr 140px 160px 70px;align-items:center;gap:8px;padding:12px 18px}
  .sl-head{color:var(--text-dim);font-size:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-1)}
  .sl-row{border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;font-size:14px}
  .sl-row:last-child{border-bottom:none}
  .sl-row:hover{background:var(--bg-2)}
  .sl-row.playing{background:linear-gradient(90deg,rgba(30,200,255,.10),transparent)}
  .sl-row.playing .title{color:var(--kg-blue)}
  .idx{color:var(--text-dim);font-variant-numeric:tabular-nums}
  .sl-row.playing .idx{color:var(--kg-blue)}
  .title-cell{display:flex;align-items:center;gap:12px;min-width:0}
  .cover{width:42px;height:42px;border-radius:8px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .title-cell .meta{min-width:0}
  .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artist,.album{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dur{color:var(--text-dim);font-variant-numeric:tabular-nums;text-align:right}

  /* Now playing panel */
  .nowplaying{width:300px;background:rgba(16,18,30,.55);border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;align-items:center}
  .disc{
    width:200px;height:200px;border-radius:50%;margin-top:10px;position:relative;
    background:conic-gradient(from 0deg,#2a2d44,#11131f,#2a2d44);
    display:grid;place-items:center;box-shadow:0 10px 40px rgba(0,0,0,.5);
    animation:spin 18s linear infinite;animation-play-state:paused;
  }
  .disc.playing{animation-play-state:running}
  .disc .cover{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
  .disc::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bg-0);box-shadow:inset 0 0 0 3px #333}
  @keyframes spin{to{transform:rotate(360deg)}}
  .np-title{margin-top:20px;font-size:18px;font-weight:700;text-align:center}
  .np-artist{color:var(--text-dim);font-size:13px;margin-top:6px;text-align:center}
  .lyrics{margin-top:18px;flex:1;width:100%;overflow:auto;text-align:center;color:var(--text-dim);font-size:13px;line-height:2}
  .lyrics .ln.active{color:var(--kg-blue);font-weight:700}

  /* Player bar */
  .player{height:84px;background:rgba(16,18,30,.85);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:grid;grid-template-columns:280px 1fr 240px;align-items:center;padding:0 20px;gap:16px}
  .p-left{display:flex;align-items:center;gap:12px;min-width:0}
  .p-left .cover{width:50px;height:50px;border-radius:8px}
  .p-left .meta{min-width:0}
  .p-left .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-left .a{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-center{display:flex;flex-direction:column;align-items:center;gap:8px}
  .controls{display:flex;align-items:center;gap:18px}
  .btn{background:none;border:none;color:var(--text);cursor:pointer;font-size:18px;opacity:.85;transition:.15s}
  .btn:hover{opacity:1;color:var(--kg-blue)}
  .btn.play{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--kg-blue),var(--kg-purple));color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(30,200,255,.4)}
  .btn.play:hover{color:#fff;transform:scale(1.05)}
  .progress{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
  .progress .time{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;width:38px;text-align:center}
  .bar{flex:1;height:5px;border-radius:3px;background:var(--bg-3);position:relative;cursor:pointer}
  .bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--kg-blue),var(--kg-purple));width:0%}
  .bar .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;left:0%;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .p-right{display:flex;align-items:center;justify-content:flex-end;gap:14px;color:var(--text-dim)}
  .vol{display:flex;align-items:center;gap:8px}
  .vol .bar{width:90px}
  .mode{cursor:pointer;font-size:13px;min-width:54px;text-align:center}
  .mode:hover{color:var(--kg-blue)}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <header class="topbar">
    <div class="logo"><span class="mark">🎵</span><span><b>酷狗</b>音乐</span></div>
    <div class="search"><input id="search" placeholder="搜索歌曲、歌手、专辑…" /></div>
    <div class="top-actions">
      <span>开通VIP</span>
      <span class="ava">U</span>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="nav-group">音乐馆</div>
      <div class="nav-item active"><span class="ic">🏠</span> 推荐</div>
      <div class="nav-item"><span class="ic">🔥</span> 排行榜</div>
      <div class="nav-item"><span class="ic">📃</span> 歌单</div>
      <div class="nav-item"><span class="ic">🎙️</span> 电台</div>
      <div class="nav-group">我的音乐</div>
      <div class="nav-item"><span class="ic">❤️</span> 我喜欢</div>
      <div class="nav-item"><span class="ic">⬇️</span> 本地与下载</div>
      <div class="nav-item"><span class="ic">🕘</span> 最近播放</div>
    </aside>

    <!-- Content -->
    <main class="content">
      <section class="hero">
        <h2>每日推荐 · 听见好时光</h2>
        <p>根据自由音乐样例生成，点击播放即可体验完整播放器交互（搜索 / 上一首 / 下一首 / 进度拖拽 / 音量 / 播放模式）。</p>
        <button class="play-hero" id="playHero">▶ 播放全部</button>
      </section>

      <div class="section-title">推荐歌曲 <a id="shuffleAll">随机播放</a></div>
      <div class="songlist">
        <div class="sl-head">
          <div>序号</div><div>音乐标题</div><div>歌手</div><div>专辑</div><div style="text-align:right">时长</div>
        </div>
        <div id="songs"></div>
      </div>
    </main>

    <!-- Now playing -->
    <aside class="nowplaying">
      <div class="disc" id="disc"><div class="cover" id="npCover"></div></div>
      <div class="np-title" id="npTitle">未在播放</div>
      <div class="np-artist" id="npArtist">选择一首歌开始吧</div>
      <div class="lyrics" id="lyrics"><div class="ln">歌词加载中…</div></div>
    </aside>
  </div>

  <!-- Player bar -->
  <footer class="player">
    <div class="p-left">
      <div class="cover" id="pCover"></div>
      <div class="meta">
        <div class="t" id="pTitle">—</div>
        <div class="a" id="pArtist">—</div>
      </div>
    </div>
    <div class="p-center">
      <div class="controls">
        <button class="btn" id="prev" title="上一首">⏮</button>
        <button class="btn play" id="toggle" title="播放/暂停">▶</button>
        <button class="btn" id="next" title="下一首">⏭</button>
      </div>
      <div class="progress">
        <span class="time" id="cur">0:00</span>
        <div class="bar" id="seek"><div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div>
        <span class="time" id="dur">0:00</span>
      </div>
    </div>
    <div class="p-right">
      <div class="mode" id="mode" title="播放模式">顺序</div>
      <div class="vol">🔊
        <div class="bar" id="vol"><div class="fill" id="volFill" style="width:70%"></div><div class="knob" id="volKnob" style="left:70%"></div></div>
      </div>
    </div>
  </footer>
</div>

<audio id="audio"></audio>
<script>
  // ---- Demo data (royalty-free SoundHelix samples, fictional metadata) ----
  const palette = [
    ["#1ec8ff","#7b5cff"],["#ff8a5b","#ff5b8a"],["#22d3a6","#1e8bff"],
    ["#f6c453","#ff7e5f"],["#a06bff","#ff6bcb"],["#3ad1ff","#2e6cff"],
    ["#ff5b8a","#ffb15b"],["#5be0a0","#1ec8ff"]
  ];
  function coverStyle(i){const [a,b]=palette[i%palette.length];return `background:linear-gradient(135deg,${a},${b})`}
  const songs = [
    {title:"夜空中的回响", artist:"林夕遥", album:"星河漫游", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", dur:234},
    {title:"潮汐之间", artist:"苏野", album:"蓝色海岸线", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", dur:286},
    {title:"霓虹城市", artist:"电音少年", album:"午夜频率", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", dur:254},
    {title:"风的形状", artist:"陈漫", album:"山与海", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", dur:297},
    {title:"旧时光信笺", artist:"温开水", album:"回忆博物馆", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", dur:312},
    {title:"银河便利店", artist:"小宇", album:"宇宙夜市", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", dur:268},
    {title:"雨后初晴", artist:"白鹭", album:"清新时刻", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", dur:241},
    {title:"追光者", artist:"晨曦乐队", album:"在路上", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", dur:263},
  ];

  const audio = document.getElementById('audio');
  const $ = id => document.getElementById(id);
  let current = -1, playing = false, mode = 0; // 0 顺序 1 随机 2 单曲循环
  const modeNames = ["顺序","随机","单曲"];

  function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')}
  function renderList(filter=""){
    const box = $('songs'); box.innerHTML="";
    songs.forEach((s,i)=>{
      if(filter && !(s.title.includes(filter)||s.artist.includes(filter)||s.album.includes(filter))) return;
      const row = document.createElement('div');
      row.className = "sl-row"+(i===current?" playing":"");
      row.dataset.i = i;
      row.innerHTML = `
        <div class="idx">${i===current&&playing?"🎵":String(i+1).padStart(2,'0')}</div>
        <div class="title-cell">
          <div class="cover" style="${coverStyle(i)}"></div>
          <div class="meta"><div class="title">${s.title}</div></div>
        </div>
        <div class="artist">${s.artist}</div>
        <div class="album">${s.album}</div>
        <div class="dur">${fmt(s.dur)}</div>`;
      row.onclick = ()=>play(i);
      box.appendChild(row);
    });
  }

  function loadMeta(i){
    const s = songs[i];
    $('pTitle').textContent = s.title;
    $('pArtist').textContent = s.artist;
    $('npTitle').textContent = s.title;
    $('npArtist').textContent = s.artist;
    $('pCover').style.cssText = coverStyle(i);
    $('npCover').style.cssText = coverStyle(i);
    $('dur').textContent = fmt(s.dur);
    $('lyrics').innerHTML = s.title.split('').map((c,k)=>`<div class="ln" data-t="${k*8}">${c} · 这是一句示例歌词 (${k+1})</div>`).join("");
  }

  function play(i){
    current = i;
    loadMeta(i);
    audio.src = songs[i].src;
    audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(true));
    renderList($('search').value.trim());
  }
  function setPlaying(p){
    playing = p;
    $('toggle').textContent = p?"⏸":"▶";
    $('disc').classList.toggle('playing', p);
    renderList($('search').value.trim());
  }
  function next(){
    if(mode===2){audio.currentTime=0;audio.play();return;}
    let i = mode===1 ? Math.floor(Math.random()*songs.length) : (current+1)%songs.length;
    play(i);
  }
  function prev(){ let i=(current-1+songs.length)%songs.length; play(i); }

  // ---- events ----
  $('toggle').onclick = ()=>{ if(current<0){play(0);return;} if(playing){audio.pause();setPlaying(false)}else{audio.play();setPlaying(true)} };
  $('next').onclick = next;
  $('prev').onclick = prev;
  $('playHero').onclick = ()=>play(0);
  $('shuffleAll').onclick = ()=>{mode=1;$('mode').textContent=modeNames[mode];play(Math.floor(Math.random()*songs.length))};
  $('mode').onclick = ()=>{mode=(mode+1)%3;$('mode').textContent=modeNames[mode]};

  audio.ontimeupdate = ()=>{
    const p = audio.currentTime/audio.duration;
    if(isFinite(p)){ $('seekFill').style.width=(p*100)+"%"; $('seekKnob').style.left=(p*100)+"%"; }
    $('cur').textContent = fmt(audio.currentTime);
    // sync lyric
    const lines=[...$('lyrics').children];
    lines.forEach(l=>{ if(audio.currentTime>=+l.dataset.t) l.classList.add('active'); else l.classList.remove('active'); });
  };
  audio.onended = ()=>{ if(mode!==2) next(); };

  function seekFrom(e,bar){
    const r=bar.getBoundingClientRect();
    const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    audio.currentTime=ratio*audio.duration;
  }
  $('seek').onclick = e=>seekFrom(e,$('seek'));
  $('vol').onclick = e=>{
    const r=$('vol').getBoundingClientRect();
    const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    audio.volume=ratio;
    $('volFill').style.width=(ratio*100)+"%"; $('volKnob').style.left=(ratio*100)+"%";
  };
  audio.volume = 0.7;

  $('search').oninput = e=>renderList(e.target.value.trim());

  renderList();
</script>
</body>
</html>
